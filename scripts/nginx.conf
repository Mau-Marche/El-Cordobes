worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Tamaño máximo de upload (para adjuntos)
    client_max_body_size 50M;

    # Logs
    access_log  logs/access.log;
    error_log   logs/error.log;

    server {
        listen       80;
        server_name  localhost taller.local;

        # ── API → Backend Node.js ──────────────────────────────────
        location /api/ {
            proxy_pass         http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Connection "";
            proxy_read_timeout 120s;
        }

        # ── Uploads (archivos adjuntos) ────────────────────────────
        location /uploads/ {
            proxy_pass         http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # ── Frontend React (archivos estáticos compilados) ─────────
        location / {
            root   FRONTEND_DIST_PLACEHOLDER;
            index  index.html;
            try_files $uri $uri/ /index.html;

            # Cache para assets con hash (JS, CSS, imágenes)
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
